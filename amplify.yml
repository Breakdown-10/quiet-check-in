version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - if [ -n "$AWS_SRC_DIR" ]; then cd "$AWS_SRC_DIR/frontend"; elif [ -d "frontend" ]; then cd frontend; fi
        - npm ci
    build:
      commands:
        - nvm use 20
        - if [ -n "$AWS_SRC_DIR" ]; then cd "$AWS_SRC_DIR/frontend"; elif [ -d "frontend" ]; then cd frontend; fi
        - npm run build
  artifacts:
    baseDirectory: frontend/out
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
      - frontend/.next/cache/**/*
