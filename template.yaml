AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Quiet Check-In: Ambient elder routine monitoring powered by Ring device event metadata,
  Amazon Bedrock Claude 3.5 Sonnet, and EventBridge Scheduled Intelligence.
  Submission for Amazon Developer Hackathon 2026.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12
    Architectures:
      - arm64
    Environment:
      Variables:
        TABLE_NAME: !Ref QuietCheckInTable
        RING_WEBHOOK_SECRET: !Ref RingWebhookSecret
        RING_HMAC_KEY: !Ref RingWebhookSecret
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_GUARDRAIL_ID: !Ref BedrockGuardrailId
        SES_FROM_ADDRESS: !Ref SesFromEmail
        SES_SENDER_EMAIL: !Ref SesFromEmail
        APP_ENV: production
        LOG_LEVEL: INFO

Parameters:
  RingWebhookSecret:
    Type: String
    NoEcho: true
    Description: Secret key configured in Ring Developer Portal for HMAC-SHA256 signature verification.
    Default: staging_ring_hmac_secret_key_demo_2026

  BedrockModelId:
    Type: String
    Description: Amazon Bedrock Model ID for AI Narrator.
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0

  BedrockGuardrailId:
    Type: String
    Description: Optional Amazon Bedrock Guardrail ID for medical/alarmist filtering.
    Default: ""

  SesFromEmail:
    Type: String
    Description: Verified Amazon SES email address for caregiver alert dispatches.
    Default: alerts@quietcheckin.local

Resources:
  ##############################################################################
  # DynamoDB: Single-Table Architecture
  ##############################################################################
  QuietCheckInTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-QuietCheckIn"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ##############################################################################
  # HTTP API Gateway
  ##############################################################################
  QuietCheckInApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "${AWS::StackName}-API"
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Signature
          - X-Ring-Signature
          - X-Amz-Date
        AllowOrigins:
          - "*"

  ##############################################################################
  # Webhook Ingest Function
  ##############################################################################
  WebhookIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-WebhookIngest"
      CodeUri: backend/
      Handler: app.main.handler
      Description: Validates HMAC-SHA256 signatures, deduplicates request_ids, and persists Ring signals.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref QuietCheckInTable
      Events:
        RingWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuietCheckInApi
            Path: /api/v1/webhooks/ring
            Method: POST

  ##############################################################################
  # API & AI Assistant Function
  ##############################################################################
  ApiServerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ApiServer"
      CodeUri: backend/
      Handler: app.main.handler
      Description: Serves caregiver dashboard endpoints, ack feedback loops, and Claude narrator chats.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref QuietCheckInTable
        - Statement:
            - Sid: BedrockInvokeAccess
              Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:ApplyGuardrail
              Resource: "*"
            - Sid: SesSendEmailAccess
              Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        GetStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuietCheckInApi
            Path: /api/v1/circles/{circle_id}/status
            Method: GET
        GetTimeline:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuietCheckInApi
            Path: /api/v1/circles/{circle_id}/timeline
            Method: GET
        GetBaseline:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuietCheckInApi
            Path: /api/v1/circles/{circle_id}/baseline
            Method: GET
        AckAlert:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuietCheckInApi
            Path: /api/v1/alerts/{alert_id}/ack
            Method: POST
        ChatAssistant:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuietCheckInApi
            Path: /api/v1/circles/{circle_id}/chat
            Method: POST
        SimTimeTravel:
          Type: HttpApi
          Properties:
            ApiId: !Ref QuietCheckInApi
            Path: /api/v1/sim/time-travel
            Method: POST

  ##############################################################################
  # Routine Intelligence Evaluator Cron Function
  ##############################################################################
  RoutineEvaluatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-RoutineEvaluator"
      CodeUri: backend/
      Handler: app.main.handler
      Description: 5-minute cron evaluating elder routine drift, daytime silence, and escalation state machine.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref QuietCheckInTable
        - Statement:
            - Sid: BedrockNarratorAccess
              Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:ApplyGuardrail
              Resource: "*"
            - Sid: SesNotificationAccess
              Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        RoutineCronSchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "rate(5 minutes)"
            Description: "Evaluates routine anomalies every 5 minutes"

Outputs:
  HttpApiUrl:
    Description: "Base URL for the Quiet Check-In HTTP API"
    Value: !Sub "https://${QuietCheckInApi}.execute-api.${AWS::Region}.amazonaws.com"
  DynamoDbTableName:
    Description: "Single-table DynamoDB resource"
    Value: !Ref QuietCheckInTable
  IngestFunctionArn:
    Description: "Ingest Lambda Function ARN"
    Value: !GetAtt WebhookIngestFunction.Arn
  ApiFunctionArn:
    Description: "API Server Lambda Function ARN"
    Value: !GetAtt ApiServerFunction.Arn
  RoutineEvaluatorArn:
    Description: "Routine Intelligence Cron Lambda ARN"
    Value: !GetAtt RoutineEvaluatorFunction.Arn
